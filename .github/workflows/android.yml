name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip JARVIS_Android_Starter.zip -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fix Java target
        working-directory: source/JARVIS_Android
        run: |
          find app -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -exec sed -i 's/VERSION_1_8/VERSION_17/g' {} +

      - name: Build APK
        working-directory: source/JARVIS_Android
        run: gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: source/JARVIS_Android/app/build/outputs/apk/debug/app-debug.apk
