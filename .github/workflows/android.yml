

name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: unzip JARVIS_Android_Starter.zip -d source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set JVM targets
        working-directory: source/JARVIS_Android
        run: |
          cat > force-jvm17.init.gradle <<'EOF'
          import org.gradle.api.tasks.compile.JavaCompile

          allprojects {
            afterEvaluate {
              tasks.withType(JavaCompile).configureEach {
                sourceCompatibility = '17'
                targetCompatibility = '17'
              }

              tasks.configureEach { task ->
                if (task.name.startsWith('compile') && task.name.endsWith('Kotlin')) {
                  task.doFirst {
                    if (task.hasProperty('kotlinOptions')) {
                      task.kotlinOptions.jvmTarget = '17'
                    }
                  }
                }
              }
            }
          }
          EOF

      - name: Build APK
        working-directory: source/JARVIS_Android
        run: gradle -I force-jvm17.init.gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: source/JARVIS_Android/app/build/outputs/apk/debug/app-debug.apk
